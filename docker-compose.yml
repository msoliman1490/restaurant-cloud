version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant_cloud_db
    restart: always
    environment:
      POSTGRES_USER: rc_admin
      POSTGRES_PASSWORD: rc_secure_dev_password_2026
      POSTGRES_DB: restaurant_cloud_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rc_admin -d restaurant_cloud_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: restaurant_cloud_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
